version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idzeme-vypic
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/game.db
    volumes:
      - ./data:/app/data
